name: CI Modern

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create isolated job environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import tempfile
          import venv
          root = Path(tempfile.mkdtemp(prefix="lomond-ci-", dir=os.environ["RUNNER_TEMP"]))
          venv.EnvBuilder(with_pip=True).create(root)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as target:
              target.write(str(root / ("Scripts" if os.name == "nt" else "bin")) + "\n")
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-mock freezegun

      - name: Run deterministic test suite
        run: |
          pytest -vv \
            --ignore=tests/test_integration.py
