name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'wildfoundry/dataplicity-lomond' && github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: pypi-publish-${{ github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate release tag format
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          case "$TAG_NAME" in
            v*) ;;
            *)
              echo "Release tag '$TAG_NAME' must start with 'v'"
              exit 1
              ;;
          esac

      - name: Validate tag matches package version
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(python -c 'from lomond._version import __version__; print(__version__)')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version '$TAG_VERSION' does not match package version '$PACKAGE_VERSION'"
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-artifacts
          path: dist/

  publish:
    needs: build
    if: github.repository == 'wildfoundry/dataplicity-lomond' && github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
